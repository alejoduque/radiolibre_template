# /etc/nginx/sites-available/reporta.altred.xyz.conf
#
# iScream — Sistema de Alerta Temprana de Radiolibre.
#
#   /          → node server.js on 127.0.0.1:3000 (the page, /api/estado)
#   /ws/stream → the same node process, websocket (mic audio → ffmpeg → Icecast)
#   /irc       → Ergo's websocket listener on 127.0.0.1:8097 (the chat)
#
# Before this existed, reporta.altred.xyz fell through to the default server
# (adj.altred.xyz's certificate and an unrelated page). The certificate is
# issued by deploy/deploy.sh cert, which serves the HTTP block alone first.
#
# Access logs are off on purpose: the page promises nothing is recorded, and
# the IPs of people reporting from a protest are exactly what not to keep.

map $http_upgrade $iscream_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name reporta.altred.xyz;

    access_log off;

    # Must not redirect, or certbot's HTTP-01 challenge cannot be read.
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://reporta.altred.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name reporta.altred.xyz;

    ssl_certificate     /etc/letsencrypt/live/reporta.altred.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reporta.altred.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log  /var/log/nginx/reporta.error.log warn;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location = /ws/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $iscream_connection_upgrade;
        proxy_set_header Host $host;
        # A broadcast can run for hours; server.js pings every 10 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /irc {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $iscream_connection_upgrade;
        proxy_set_header Host $host;
        # Ergo trusts this from localhost (proxy-allowed-from) and cloaks it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ (^|/)\. { return 404; }
}
