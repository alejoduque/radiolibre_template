<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiempoGranular</title>
<style>
  :root { --gap: 10px; }
  html, body { margin:0; background:#000; color:#fff; }
  body { font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* Hero: a single hydra output with the logo over it. One output rather than
     four because the logo is a transparent PNG — over a 2x2 grid it sat on
     whatever each quadrant happened to be doing and became unreadable. The
     storm clip is the one with enough white to carry it. */
  .hero { position:relative; width:100%; height:72vh; min-height:320px;
    overflow:hidden; background:#000; }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* Layered over the hydra output, bottom to top: the still, the spectrum,
     then the logo. */

  /* This PNG is fully opaque and mostly black (median luminance 7) with bright
     highlights. screen drops the black ground and keeps the highlights, so it
     sits over the video without a visible rectangle. */
  .still { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:1; mix-blend-mode:screen; opacity:.9;
    pointer-events:none; }

  /* The spectrum is a PURE BLACK silhouette on transparency — every visible
     pixel measures luminance 0. On a black page it is invisible, and under
     screen it disappears entirely, which is what happened to it before.
     Inverting turns the silhouette white so it reads. */
  .spectrum { position:absolute; left:0; right:0; bottom:0; width:100%;
    z-index:2; filter:invert(1); opacity:.55; pointer-events:none; }

  .logo { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(46vw, 430px); z-index:3; pointer-events:none; }

  /* The other clips sit BELOW where the logo ends, not over it. */
  .strip { display:flex; flex-wrap:wrap; gap:var(--gap); padding:var(--gap); }
  .strip video { flex:1 1 260px; min-width:0; width:100%; height:auto;
    display:block; background:#111; }

  .ui { padding:6px var(--gap) 26px; }
  .ui a, .ui button {
    background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.45);
    padding:6px 12px; margin:0 6px 8px 0; cursor:pointer; text-decoration:none;
    font:inherit; border-radius:3px; display:inline-block;
  }
  .ui a:hover, .ui button:hover { background:#fff; color:#000; }
  .credit { margin:10px 0 0; max-width:60ch; color:#cfcfcf; font-size:13px; }

  #msg { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; z-index:4; background:rgba(0,0,0,.5);
    cursor:pointer; text-align:center; }
  #msg[hidden] { display:none; }

  @media (max-width: 600px) {
    .hero { height:56vh; }
    .logo { width:70vw; }
  }
</style>
</head>
<body>

<section class="hero">
  <canvas id="c"></canvas>
  <img class="still" alt=""
       src="/mdelibre/tg/?TiempoGranular.head.160168435816">
  <img class="spectrum" alt=""
       src="/mdelibre/tg/content/TiempoGranular/shared/ondas_spectravue_transp.png">
  <img class="logo" alt="TiempoGranular"
       src="/mdelibre/tg/content/TiempoGranular/shared/tg_logo.png">
  <div id="msg">cargando…</div>
</section>

<div class="strip">
  <video class="clip" src="/archivos/arbol.webm" muted loop playsinline preload="metadata"></video>
  <video class="clip" src="/archivos/rarae_aves_2016_fast.mp4" muted loop playsinline preload="metadata"></video>
</div>

<div class="ui">
  <button id="toggle" type="button">pausa</button>
  <a href="https://altred.xyz/">altred &#8599;</a>
  <p class="credit">Residencia Emergente - Museo de Antioquia</p>
</div>

<script src="/assets/js/hydra-synth.js"></script>
<script>
(function () {
  'use strict';

  var HERO_CLIP = '/archivos/storm.webm';

  var canvas = document.getElementById('c');
  var msg = document.getElementById('msg');
  var toggle = document.getElementById('toggle');
  var strip = Array.prototype.slice.call(document.querySelectorAll('.strip video'));
  var heroVideo = null;
  var running = true;

  function fail(t) { msg.hidden = false; msg.textContent = t; }

  if (typeof window.Hydra === 'undefined') { fail('no se pudo cargar hydra-synth.js'); return; }

  // The canvas is sized to the hero, not the window, since it no longer covers
  // the page.
  function size() {
    var r = canvas.parentNode.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width));
    canvas.height = Math.max(1, Math.round(r.height));
  }
  size();
  window.addEventListener('resize', size);

  try {
    new window.Hydra({ canvas: canvas, detectAudio: false, enableStreamCapture: false });
  } catch (e) {
    fail('este navegador no puede iniciar WebGL');
    return;
  }

  // muted/playsinline/loop must be set before play(): autoplay is only allowed
  // for muted video, and playsinline stops iOS going fullscreen.
  heroVideo = document.createElement('video');
  heroVideo.src = HERO_CLIP;
  heroVideo.loop = true;
  heroVideo.muted = true;
  heroVideo.defaultMuted = true;
  heroVideo.playsInline = true;
  heroVideo.setAttribute('playsinline', '');
  heroVideo.setAttribute('muted', '');
  heroVideo.preload = 'auto';

  s0.init({ src: heroVideo });

  // No treatment, and a single output: render(o0) rather than the 2x2 grid.
  src(s0).out(o0);
  render(o0);

  function playAll() {
    var all = [heroVideo].concat(strip);
    return Promise.all(all.map(function (v) {
      var p = v.play();
      return p && p.catch ? p.catch(function () {}) : Promise.resolve();
    }));
  }

  heroVideo.play().then(function () {
    msg.hidden = true;
    strip.forEach(function (v) { v.play().catch(function () {}); });
  }).catch(function () {
    msg.hidden = false;
    msg.textContent = 'tocar para comenzar';
    msg.addEventListener('click', function once() {
      msg.removeEventListener('click', once);
      playAll().then(function () { msg.hidden = true; });
    });
  });

  toggle.addEventListener('click', function () {
    running = !running;
    [heroVideo].concat(strip).forEach(function (v) {
      running ? v.play().catch(function () {}) : v.pause();
    });
    toggle.textContent = running ? 'pausa' : 'seguir';
  });

  // Four videos decoding for a tab nobody is looking at is pure waste.
  document.addEventListener('visibilitychange', function () {
    var all = [heroVideo].concat(strip);
    if (document.hidden) { all.forEach(function (v) { v.pause(); }); }
    else if (running) { all.forEach(function (v) { v.play().catch(function () {}); }); }
  });
})();
</script>
</body>
</html>
