<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R A D I O L I B R E</title>
    <meta name="description" content="La radio como lugar común. Transmisiones colaborativas de radio en red desde subamérica.">

    <link rel="icon" href="./assets/logo.jpeg">
    <!-- ?v= on the asset URLs is deliberate: nginx serves .js and .css here as
         `immutable` for a year, so an update only reaches returning listeners
         if the URL changes. Bump every ?v= together. See assets/js/config.js. -->
    <link rel="stylesheet" href="./assets/styles.css?v=3">
</head>

<body>
    <div class="main-content-wrapper">
        <div class="content">
            <div class="main-image">
                <!-- Relative, not https://altred.xyz/assets/logo.jpeg: that host
                     answers with a certificate issued only for adj.altred.xyz,
                     so the logo failed to load for every visitor. -->
                <img src="./assets/logo.jpeg" alt="RadioLibre" width="1265" height="1280">
            </div>

            <div class="text">
                <h1>La Radio, lugar común</h1>
                <p class="tagline">
                    <span class="tagline__lead">Creamos de manera colaborativa transmisiones para compartir lo que esté pasando.</span>
                    <span class="tagline__en">Shared net.radio streams by socially involved groups from *SubAmerica.</span>
                    <span class="tagline__tag">#TodoEsRadio!</span>
                </p>
            </div>

            <section class="stations" aria-labelledby="stations-title">
                <h2 id="stations-title" class="stations__title">En vivo</h2>
                <p id="stations-message" class="stations__message" role="status" aria-live="polite"></p>
                <!-- One card per live mount, filled by assets/js/ui.js. Each
                     card's audio opens only when someone presses play. -->
                <ul id="stations" class="stations__list"></ul>
            </section>
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="https://lists.riseup.net/www/info/radiolibre" target="_blank" rel="noopener noreferrer">Lista de correos</a></li>
            <li><a href="https://we.riseup.net/radiolibre" target="_blank" rel="noopener noreferrer">Documentación</a></li>
            <li><a href="https://reporta.altred.xyz/" target="_blank" rel="noopener noreferrer">Transmitir en vivo</a></li>
            <li><a href="https://live.altred.xyz/" target="_blank" rel="noopener noreferrer">Estado</a></li>
            <li>
                <a href="https://www.instagram.com/_radiolibre/" target="_blank" rel="noopener noreferrer">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true" focusable="false">
                        <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/>
                    </svg>
                    <span>_radiolibre</span>
                </a>
            </li>
        </ul>
    </nav>

    <script type="module" src="./assets/js/main.js?v=3"></script>
</body>
</html>
