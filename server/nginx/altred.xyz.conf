# /etc/nginx/sites-available/altred.xyz.conf
#
# altred.xyz — the file archive, plus the hotglue installs under /mdelibre/.
#
# The radio itself lives on radiolibre.altred.xyz and is configured separately;
# nothing here touches it.
#
# Install with:
#   curl -fsSL https://raw.githubusercontent.com/alejoduque/radiolibre_template/main/server/nginx/altred.xyz.conf -o /etc/nginx/sites-available/altred.xyz.conf
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name altred.xyz www.altred.xyz;

    # Must not redirect, or certbot's HTTP-01 challenge cannot be read.
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://altred.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.altred.xyz;

    ssl_certificate     /etc/letsencrypt/live/altred.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altred.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://altred.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name altred.xyz;

    ssl_certificate     /etc/letsencrypt/live/altred.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altred.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # No HSTS here on purpose: a stale HSTS pin against a bad certificate is
    # what made this host unreachable before. Add it once renewals are proven.
    add_header X-Content-Type-Options nosniff always;

    root /var/www/altred.xyz;

    # The generated file index is the landing page. root stays at the webroot
    # so that the absolute links inside it (/Portafolio....html) still resolve.
    location = / { try_files /archivo/index.html =404; }

    # The radio page also sits in this webroot; keep it canonical on its own
    # host, where the Icecast proxies exist.
    location = /index.html { return 301 https://radiolibre.altred.xyz/; }

    # hotglue, reached through the symlink /var/www/altred.xyz/mdelibre
    # -> /var/www/html. A symlink plus root is used rather than alias:
    # alias combined with a nested fastcgi block routinely produces a wrong
    # SCRIPT_FILENAME.
    #
    # SCRIPT_NAME arrives as /mdelibre/index.php, so dirname($_SERVER['PHP_SELF'])
    # is /mdelibre and hotglue's base_url() builds the correct prefix with no
    # BASE_URL override.
    location ^~ /mdelibre/ {
        # index.html too, not just index.php: this block's index directive
        # replaces the server-level one, and some of the sub-installs (1999)
        # are plain static sites that would otherwise 403.
        index index.php index.html index.htm;

        # Only takes effect where no index file exists, so the hotglue
        # installs still serve their index.php. This is what makes the plain
        # static archives (1999 and friends) browsable instead of 403.
        autoindex on;
        try_files $uri $uri/ /mdelibre/index.php?$query_string;

        # ^~ wins over the server-level regex locations, so the dotfile rule
        # has to be repeated inside this block.
        location ~ /\. { deny all; }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php7.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Without this hotglue emits http:// URLs and the browser blocks
            # every asset as mixed content.
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 60s;
        }
    }

    location / { try_files $uri $uri/ =404; }

    location ~ /\. { deny all; }
    location ~* \.(bak|old|bkp|conf|cfg|ini|env|key|pem|sql|dump|log)$ { deny all; }
}
